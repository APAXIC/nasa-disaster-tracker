services:
  api:
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT:-5000}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/nasa_eonet}
      - EONET_API_URL=${EONET_API_URL:-https://eonet.gsfc.nasa.gov/api/v3}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:irishardron@gmail.com}
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nasa_eonet}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: