services:
  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT:-5000}
      - DATABASE_URL=${DATABASE_URL}
      - EONET_API_URL=${EONET_API_URL}
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nasa_eonet}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: